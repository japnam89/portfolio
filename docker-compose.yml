# Portfolio (japnam.tech) deployment on the Hostinger VPS, behind the
# existing Traefik proxy.
#
# IMPORTANT: the traefik stack on this VPS runs with `network_mode: host`,
# so there is NO user-defined bridge network to join. Instead we run this
# container in host network mode too; Traefik (also host) reaches it at
# 127.0.0.1:3000. The traefik labels below let Traefik route japnam.tech
# -> this service automatically.
#
# Usage (on the VPS, in the repo dir):
#   cp .env.example .env   # then fill in real values (RUSTFS_*, passwords)
#   docker compose up -d --build
# DNS already points japnam.tech at this VPS, so Traefik starts serving it.
#
# Secrets are NOT in this file — they come from the gitignored .env via
# ${VAR} interpolation (Docker Compose auto-loads .env in this dir).
# Never commit .env; .env.example documents the required variables.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: japnam-web:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      # Persist the SQLite blog DB (data/blog.db) across container recreations.
      # Without this, posts vanish on every `docker compose up --build`.
      - japnam-data:/data
    environment:
      NODE_ENV: production
      PORT: "3000"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY}"
      RUSTFS_ENDPOINT: "${RUSTFS_ENDPOINT}"
      RUSTFS_REGION: "${RUSTFS_REGION}"
      RUSTFS_BUCKET: "${RUSTFS_BUCKET}"
      RUSTFS_URL_EXPIRES: "${RUSTFS_URL_EXPIRES}"
      POST_ADMIN_PASSWORD: "${POST_ADMIN_PASSWORD}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      CONTACT_TO_EMAIL: "${CONTACT_TO_EMAIL}"
      CONTACT_FROM_EMAIL: "${CONTACT_FROM_EMAIL}"
      NEXT_PUBLIC_PAYPAL_URL: "${NEXT_PUBLIC_PAYPAL_URL}"
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.japnam.rule=Host(`japnam.tech`) || Host(`www.japnam.tech`)'
      - 'traefik.http.routers.japnam.entrypoints=websecure'
      - 'traefik.http.routers.japnam.tls=true'
      - 'traefik.http.routers.japnam.tls.certresolver=letsencrypt'
      - 'traefik.http.services.japnam.loadbalancer.server.port=3000'
      - 'traefik.http.middlewares.japnam-www.redirectregex.regex=^https?://www\.japnam\.tech/(.*)'
      - 'traefik.http.middlewares.japnam-www.redirectregex.replacement=https://japnam.tech/$${1}'
      - 'traefik.http.routers.japnam-www.rule=Host(`www.japnam.tech`)'
      - 'traefik.http.routers.japnam-www.entrypoints=websecure'
      - 'traefik.http.routers.japnam-www.tls=true'
      - 'traefik.http.routers.japnam-www.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.japnam-www.middlewares=japnam-www'

# Named volume for persistent blog DB (mounted at /data inside the container).
# Declared at the top level so Docker creates/keeps it across `up --build`.
volumes:
  japnam-data:
