name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manually re-running the deploy (e.g. after adding repo secrets).
  workflow_dispatch:

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build degrades gracefully without these; only needed at runtime
          # for the live RustFS photo gallery.
          RUSTFS_BUCKET: photos
          RUSTFS_REGION: us-east-1
          RUSTFS_URL_EXPIRES: "3600"

  deploy:
    name: Deploy to host
    # Only deploy on a push to main or a manual dispatch (never on PRs).
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push')
      || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Prepare SSH key (normalize CRLF/newlines)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_SSH_KEY secret is empty — set it in repo Settings > Secrets."
            exit 1
          fi
          # Write the raw PEM secret to a file. GitHub secrets preserve
          # newlines, so this round-trips a multiline private key faithfully.
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/deploy_key"
          # Strip any carriage returns (Windows CRLF) and lock perms.
          sed -i 's/\r$//' "$HOME/deploy_key"
          chmod 600 "$HOME/deploy_key"
          eval "$(ssh-agent -s)"
          ssh-add "$HOME/deploy_key"
          # DEBUG: show the fingerprint the agent will offer, and the first
          # line of the key file. Compare the fingerprint to:
          #   ssh-keygen -l -f ~/.ssh/japnam-deploy   (on your machine)
          # If they differ, the DEPLOY_SSH_KEY secret is NOT japnam-deploy.
          echo "::group::ssh debug"
          echo "Target: $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PORT"
          echo "Loaded key fingerprint(s):"
          ssh-add -l
          echo "First line of key file (sanity):"
          head -1 "$HOME/deploy_key"
          echo "::endgroup::"

      - name: Add host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull, render .env, and rebuild on the host
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e
             cd /root/portfolio
             git pull origin main
             printf 'RUSTFS_ACCESS_KEY=%s\nRUSTFS_SECRET_KEY=%s\nRUSTFS_ENDPOINT=%s\nRUSTFS_REGION=%s\nRUSTFS_BUCKET=%s\nRUSTFS_URL_EXPIRES=%s\nPOST_ADMIN_PASSWORD=%s\n' \
               '${{ secrets.RUSTFS_ACCESS_KEY }}' \
               '${{ secrets.RUSTFS_SECRET_KEY }}' \
               '${{ secrets.RUSTFS_ENDPOINT }}' \
               '${{ secrets.RUSTFS_REGION }}' \
               '${{ secrets.RUSTFS_BUCKET }}' \
               '${{ secrets.RUSTFS_URL_EXPIRES }}' \
               '${{ secrets.POST_ADMIN_PASSWORD }}' > .env
             docker compose up -d --build
             docker image prune -f"
