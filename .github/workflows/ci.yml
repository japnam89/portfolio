name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manually re-running the deploy (e.g. after adding repo secrets).
  workflow_dispatch:

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build degrades gracefully without these; only needed at runtime
          # for the live RustFS photo gallery.
          RUSTFS_BUCKET: photos
          RUSTFS_REGION: us-east-1
          RUSTFS_URL_EXPIRES: "3600"

  deploy:
    name: Deploy to VPS
    # Only deploy on a push to main or a manual dispatch (never on PRs).
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push')
      || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - name: Prepare SSH key (normalize CRLF/newlines)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY secret is empty — set it in repo Settings > Secrets."
            exit 1
          fi
          # Write key to a file, strip carriage returns (Windows CRLF is a
          # common cause of 'error in libcrypto' from ssh-add), ensure trailing
          # newline, lock perms.
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/vps_key"
          sed -i 's/\r$//' "$HOME/vps_key"
          chmod 600 "$HOME/vps_key"
          eval "$(ssh-agent -s)"
          ssh-add "$HOME/vps_key"
          # DEBUG: show the fingerprint(s) the agent will offer, and the
          # resolved target. Compare the fingerprint to:
          #   ssh-keygen -l -f ~/.ssh/japnam-deploy   (on your machine)
          echo "::group::ssh debug"
          echo "Target: $VPS_USER@$VPS_HOST:$VPS_PORT"
          echo "Loaded key fingerprint(s):"
          ssh-add -l
          echo "First line of key file (sanity):"
          head -1 "$HOME/vps_key"
          echo "::endgroup::"

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Pull, render .env, and rebuild on the VPS
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "set -e
             cd /root/portfolio
             git pull origin main
             printf 'RUSTFS_ACCESS_KEY=%s\nRUSTFS_SECRET_KEY=%s\nRUSTFS_ENDPOINT=%s\nRUSTFS_REGION=%s\nRUSTFS_BUCKET=%s\nRUSTFS_URL_EXPIRES=%s\nPOST_ADMIN_PASSWORD=%s\n' \
               '${{ secrets.RUSTFS_ACCESS_KEY }}' \
               '${{ secrets.RUSTFS_SECRET_KEY }}' \
               '${{ secrets.RUSTFS_ENDPOINT }}' \
               '${{ secrets.RUSTFS_REGION }}' \
               '${{ secrets.RUSTFS_BUCKET }}' \
               '${{ secrets.RUSTFS_URL_EXPIRES }}' \
               '${{ secrets.POST_ADMIN_PASSWORD }}' > .env
             docker compose up -d --build
             docker image prune -f"
