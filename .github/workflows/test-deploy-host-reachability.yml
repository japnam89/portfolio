name: Test deploy host reachability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test SFTP port reachability
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          python3 - <<'PY'
          import os
          import socket
          import sys

          host = os.environ.get("DEPLOY_HOST")
          if not host:
              print("DEPLOY_HOST secret is missing")
              sys.exit(1)

          try:
              with socket.create_connection((host, 22), timeout=10):
                  print("TCP port 22 is reachable from the GitHub-hosted runner")
          except OSError as error:
              print(f"TCP connection failed: {type(error).__name__}")
              sys.exit(1)
          PY
